<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover deja que la app pinte debajo de la barra de gestos
         del celular; sin eso env(safe-area-inset-*) devuelve siempre 0. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f8f9ff" />
    <title>Qwak</title>
    <meta
      name="description"
      content="Registrá ingresos y egresos, clasificalos por categoría y mirá el balance de cada mes."
    />

    <!-- App instalable. El manifiesto (nombre, iconos, pantalla completa) lo
         leen Chrome en Android y Windows; iOS lo ignora casi entero y se guia
         por las etiquetas apple-* de abajo. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Qwak" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- Tipografias del diseño de Stitch: Manrope para textos y numeros,
         Plus Jakarta Sans para etiquetas. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&family=Plus+Jakarta+Sans:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
